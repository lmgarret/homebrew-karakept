name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # update-cask.yml dispatches this on its bump branch: a PR opened with
  # GITHUB_TOKEN does not trigger pull_request workflows by itself.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cask:
    name: Audit and install cask
    # Apple silicon, matching the cask's depends_on arch.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Checks the tap out itself and links it into Homebrew's Taps directory.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # main
        with:
          # Only needed while the repository is private.
          token: ${{ github.token }}

      - name: Style
        run: brew style lmgarret/karakept

      - name: Audit
        run: brew audit --cask --strict --online lmgarret/karakept/karakept

      - name: Check livecheck
        run: brew livecheck --cask lmgarret/karakept/karakept

      - name: Install
        run: brew install --cask lmgarret/karakept/karakept

      - name: Uninstall
        run: brew uninstall --cask --zap lmgarret/karakept/karakept

  zizmor:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Code scanning upload needs GitHub Advanced Security on a private repo.
          advanced-security: false
          annotations: true
