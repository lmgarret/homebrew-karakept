name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # update-cask.yml calls it to test a new version before pushing it to main.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      sha256:
        type: string
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cask:
    name: Audit and install cask
    # Apple silicon, matching the cask's depends_on arch.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Checks the tap out itself and links it into Homebrew's Taps directory.
      # Homebrew/actions publishes no tags, so the pin can only track main, which
      # moves on from it with every push upstream.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@9f17989bd508c794353d974d1756f23b0bcf10c1 # main  # zizmor: ignore[ref-version-mismatch]

      - name: Apply new version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          SHA256: ${{ inputs.sha256 }}
        run: .github/scripts/set-cask-version.sh "$VERSION" "$SHA256"

      - name: Style
        run: brew style lmgarret/karakept

      - name: Audit
        run: brew audit --cask --strict --online lmgarret/karakept/karakept

      - name: Check livecheck
        run: brew livecheck --cask lmgarret/karakept/karakept

      - name: Install
        run: brew install --cask lmgarret/karakept/karakept

      - name: Uninstall
        run: brew uninstall --cask --zap lmgarret/karakept/karakept

  zizmor:
    name: Lint workflows
    if: inputs.version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Code scanning upload needs GitHub Advanced Security on a private repo.
          advanced-security: false
          annotations: true
