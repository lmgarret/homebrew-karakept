name: Update cask

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UPSTREAM: lmgarret/karakept-kmp
  CASK: Casks/karakept.rb

jobs:
  check:
    name: Check for a new release
    # publish pushes the checked-out commit to main; from any other branch that
    # would fast-forward main onto unreviewed commits.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "Latest" excludes pre-releases, so the nightly build is never picked up.
          tag="$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag: $tag"
            exit 1
          fi
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$CASK")"
          if [[ "$version" == "$current" ]]; then
            echo "Cask is up to date ($current)."
            exit 0
          fi
          echo "Updating $current -> $version."
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download and verify DMG
        id: verify
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          dmg="$RUNNER_TEMP/Karakept-$VERSION.dmg"
          gh release download "v$VERSION" --repo "$UPSTREAM" \
            --pattern "Karakept-$VERSION.dmg" --output "$dmg"
          # Refuse to pin a checksum for anything the upstream release workflow
          # did not build on a GitHub-hosted runner.
          gh attestation verify "$dmg" --repo "$UPSTREAM" \
            --signer-workflow "$UPSTREAM/.github/workflows/release.yml" \
            --deny-self-hosted-runners
          echo "sha256=$(sha256sum "$dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  tests:
    name: Test new version
    needs: check
    if: needs.check.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ needs.check.outputs.version }}
      sha256: ${{ needs.check.outputs.sha256 }}

  publish:
    name: Push cask update
    needs: [check, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the bump commit to main
    steps:
      # Same commit Tests ran against: if main has moved since, the push is
      # rejected as non-fast-forward and the next run retries on the new main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update cask
        env:
          VERSION: ${{ needs.check.outputs.version }}
          SHA256: ${{ needs.check.outputs.sha256 }}
        run: .github/scripts/set-cask-version.sh "$VERSION" "$SHA256"

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "karakept $VERSION" \
            -m "Release: https://github.com/$UPSTREAM/releases/tag/v$VERSION" \
            -m "DMG build provenance verified against $UPSTREAM/.github/workflows/release.yml."
          gh auth setup-git
          git push origin HEAD:main
